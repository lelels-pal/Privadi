name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.app
    - name: Build and Test
      run: xcodebuild test -scheme Privadi -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest'